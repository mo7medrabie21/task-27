<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Training</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <!-- First Task -->
        <div class=" p-4 mb-5 text-center">

            <h4 class="mb-4" id="title">Lorem ipsum dolor sit amet.</h4>

            <button onclick="leftText()" class="btn btn-primary">
                left
            </button>

            <button onclick="centerText()" class="btn btn-danger">
                center
            </button>

            <button onclick="rightText()" class="btn btn-dark">
                right
            </button>

        </div>


        <!-- To Do List -->

        <h2 class="text-center">To Do List</h2>

       <div class="mb-4">

    <input
        type="text"
        id="work"
        class="form-control mb-2"
        placeholder="Enter your work"
    >

    <button
        onclick="addWork()"
        class="btn btn-primary w-100">
        Enter
    </button>

</div>


        <table class="table table-bordered text-center">

            <thead>
                <tr>
                    <th>Work</th>
                    <th>Delete</th>
                </tr>
            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>


    <script src="main.js"></script>

</body>
</html>
